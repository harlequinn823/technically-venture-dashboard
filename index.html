      theme: {

            brand: {

    // Initial Venture Monitor dataset

      },
      {

      {

        market: "Baltimore",

      },
      {
        id: "del-q4-2025",
        title: "Delaware venture deals tally $148M in Q4 2025 driven by chemical and legal-tech",
        market: "Delaware",
        quarter: "Q4",
        year: 2025,
        totalCapitalMillions: 148.0,
        dealCount: 19,
        avgDealSizeMillions: 7.78,
        date: "2026-01-20",
        url: "https://technical.ly/venture-monitor-snapshots/",
        summary: "Wilmington and Newark corporate tech ecosystems experienced healthy series rounds in sustainable materials, corporate law automation, and payments.",
        notableDeals: ["PolymerNext ($42M)", "FirstState Legal AI ($25M)", "DelawareGovTech ($14M)"]
      }
    ];

    function App() {
      const [articles, setArticles] = useState(() => {
        const saved = localStorage.getItem('technically_articles');
        return saved ? JSON.parse(saved) : INITIAL_ARTICLES;
      });

      const [viewMode, setViewMode] = useState('snapshots'); // 'snapshots' | 'compare'
      const [searchTerm, setSearchTerm] = useState('');
      const [selectedMarket, setSelectedMarket] = useState('ALL');
      const [selectedYear, setSelectedYear] = useState('ALL');
      const [selectedQuarter, setSelectedQuarter] = useState('ALL');
      const [sortBy, setSortBy] = useState('vc-desc'); // 'vc-desc' | 'vc-asc' | 'deals-desc' | 'deals-asc' | 'newest'
      const [compareSelectedMarkets, setCompareSelectedMarkets] = useState(['Philadelphia', 'DC / DMV', 'Pittsburgh']);
      const [isModalOpen, setIsModalOpen] = useState(false);

      // Modal Form State
      const [formData, setFormData] = useState({
        title: '',
        market: 'Philadelphia',
        quarter: 'Q2',
        year: 2026,
        totalCapitalMillions: '',
        dealCount: '',
        summary: '',
        url: 'https://technical.ly/venture-monitor-snapshots/',
        notableDeals: ''
      });

      useEffect(() => {
        localStorage.setItem('technically_articles', JSON.stringify(articles));
      }, [articles]);

      const availableMarkets = useMemo(() => {
        const m = new Set(articles.map(a => a.market));
        return Array.from(m).sort();
      }, [articles]);

      const availableYears = useMemo(() => {
        const y = new Set(articles.map(a => a.year));
        return Array.from(y).sort((a, b) => b - a);
      }, [articles]);

      // Filtered & Sorted Articles
      const filteredArticles = useMemo(() => {
        return articles.filter(item => {
          const matchMarket = selectedMarket === 'ALL' || item.market === selectedMarket;
          const matchYear = selectedYear === 'ALL' || item.year.toString() === selectedYear;
          const matchQuarter = selectedQuarter === 'ALL' || item.quarter === selectedQuarter;
          const matchSearch = !searchTerm || 
            item.title.toLowerCase().includes(searchTerm.toLowerCase()) ||
            item.summary.toLowerCase().includes(searchTerm.toLowerCase()) ||
            item.market.toLowerCase().includes(searchTerm.toLowerCase()) ||
            (item.notableDeals && item.notableDeals.some(d => d.toLowerCase().includes(searchTerm.toLowerCase())));

          return matchMarket && matchYear && matchQuarter && matchSearch;
        }).sort((a, b) => {
          if (sortBy === 'vc-desc') return b.totalCapitalMillions - a.totalCapitalMillions;
          if (sortBy === 'vc-asc') return a.totalCapitalMillions - b.totalCapitalMillions;
          if (sortBy === 'deals-desc') return b.dealCount - a.dealCount;
          if (sortBy === 'deals-asc') return a.dealCount - b.dealCount;
          if (sortBy === 'newest') return new Date(b.date) - new Date(a.date);
          return 0;
        });
      }, [articles, selectedMarket, selectedYear, selectedQuarter, searchTerm, sortBy]);

      // Top KPI metrics based on current filter scope
      const stats = useMemo(() => {
        const totalCapital = filteredArticles.reduce((acc, curr) => acc + (curr.totalCapitalMillions || 0), 0);
        const totalDeals = filteredArticles.reduce((acc, curr) => acc + (curr.dealCount || 0), 0);
        const avgRound = totalDeals > 0 ? (totalCapital / totalDeals) : 0;

        // Group by market to find leading market
        const marketTotals = {};
        filteredArticles.forEach(a => {
          marketTotals[a.market] = (marketTotals[a.market] || 0) + a.totalCapitalMillions;
        });
        let topMarket = 'None';
        let topVal = 0;
        Object.entries(marketTotals).forEach(([m, val]) => {
          if (val > topVal) {
            topVal = val;
            topMarket = m;
          }
        });

        return {
          totalCapital: totalCapital.toFixed(1),
          totalDeals,
          avgRound: avgRound.toFixed(2),
          topMarket,
          topMarketVal: topVal.toFixed(1)
        };
      }, [filteredArticles]);

      // Market Head-to-Head Comparison Stats
      const comparisonStats = useMemo(() => {
        return compareSelectedMarkets.map(market => {
          const matching = articles.filter(a => {
            const matchesYear = selectedYear === 'ALL' || a.year.toString() === selectedYear;
            const matchesQuarter = selectedQuarter === 'ALL' || a.quarter === selectedQuarter;
            return a.market === market && matchesYear && matchesQuarter;
          });

          const totalCap = matching.reduce((sum, a) => sum + (a.totalCapitalMillions || 0), 0);
          const totalDeals = matching.reduce((sum, a) => sum + (a.dealCount || 0), 0);
          const avgCheck = totalDeals > 0 ? totalCap / totalDeals : 0;

          return {
            market,
            totalCapitalMillions: totalCap,
            dealCount: totalDeals,
            avgCheckMillions: avgCheck,
            reportCount: matching.length
          };
        }).sort((a, b) => b.totalCapitalMillions - a.totalCapitalMillions);
      }, [compareSelectedMarkets, articles, selectedYear, selectedQuarter]);

      // CSV Export
      const exportCSV = () => {
        const headers = ["Market", "Quarter", "Year", "Total Capital ($M)", "Deal Count", "Avg Deal Size ($M)", "Title", "URL"];
        const rows = filteredArticles.map(a => [
          `"${a.market}"`,
          `"${a.quarter}"`,
          a.year,
          a.totalCapitalMillions,
          a.dealCount,
          a.avgDealSizeMillions,
          `"${a.title.replace(/"/g, '""')}"`,
          `"${a.url}"`
        ]);

        const csvContent = "data:text/csv;charset=utf-8," + [headers.join(','), ...rows.map(e => e.join(','))].join('\n');
        const encodedUri = encodeURI(csvContent);
        const link = document.createElement("a");
        link.setAttribute("href", encodedUri);
        link.setAttribute("download", `technically_venture_data_${Date.now()}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      // Add Snapshot Submission
      const handleFormSubmit = (e) => {
        e.preventDefault();
        const cap = parseFloat(formData.totalCapitalMillions) || 0;
        const deals = parseInt(formData.dealCount, 10) || 1;
        const avg = deals > 0 ? (cap / deals) : 0;

        const newArticle = {
          id: `${formData.market.toLowerCase().replace(/[^a-z]/g, '')}-${formData.quarter.toLowerCase()}-${formData.year}-${Date.now()}`,
          title: formData.title,
          market: formData.market,
          quarter: formData.quarter,
          year: parseInt(formData.year, 10),
          totalCapitalMillions: cap,
          dealCount: deals,
          avgDealSizeMillions: parseFloat(avg.toFixed(2)),
          date: new Date().toISOString().split('T')[0],
          url: formData.url || "https://technical.ly/venture-monitor-snapshots/",
          summary: formData.summary,
          notableDeals: formData.notableDeals ? formData.notableDeals.split(',').map(s => s.trim()) : []
        };

        setArticles([newArticle, ...articles]);
        setIsModalOpen(false);
        setFormData({
          title: '',
          market: 'Philadelphia',
          quarter: 'Q2',
          year: 2026,
          totalCapitalMillions: '',
          dealCount: '',
          summary: '',
          url: 'https://technical.ly/venture-monitor-snapshots/',
          notableDeals: ''
        });
      };

      return (
        <div className="min-h-screen flex flex-col">
          {/* Main Top Header - Deep Navy / Blue Branding */}
          <header className="bg-[#022333] text-white px-6 py-6 shadow-md border-b-4 border-[#03E26D]">
            <div className="max-w-7xl mx-auto flex flex-col lg:flex-row lg:items-center lg:justify-between gap-6">
              
              {/* Brand Logo & Title */}
              <div className="flex items-center space-x-4">
                <div className="w-12 h-12 bg-[#03E26D] rounded-xl flex items-center justify-center font-black text-2xl text-[#022333] shadow-inner">
                  T.
                </div>
                <div>
                  <div className="flex items-center space-x-2">
                    <span className="text-2xl font-black tracking-tight">Technical.ly</span>
                    <span className="text-xs bg-[#084867] text-[#A7FFD1] font-bold px-2 py-0.5 rounded-full border border-[#0D6B98]">
                      Venture Monitor Snapshots
                    </span>
                  </div>
                  <p className="text-xs text-gray-300 mt-0.5">
                    PitchBook-NVCA quarterly VC series explorer across local tech hubs &bull; Interactive
                  </p>
                </div>
              </div>

              {/* View Switches & Action Buttons */}
              <div className="flex flex-wrap items-center gap-3">
                <div className="bg-[#084867] p-1 rounded-xl flex items-center border border-[#0D6B98]">
                  <button
                    onClick={() => setViewMode('snapshots')}
                    className={`px-4 py-2 rounded-lg text-xs font-bold transition flex items-center ${
                      viewMode === 'snapshots'
                        ? 'bg-[#03E26D] text-[#022333] shadow-md'
                        : 'text-[#F0F0F0] hover:text-white'
                    }`}
                  >
                    Article Snapshots
                  </button>
                  <button
                    onClick={() => setViewMode('compare')}
                    className={`px-4 py-2 rounded-lg text-xs font-bold transition flex items-center ${
                      viewMode === 'compare'
                        ? 'bg-[#03E26D] text-[#022333] shadow-md'
                        : 'text-[#F0F0F0] hover:text-white'
                    }`}
                  >
                    <IconBarChart />
                    Market Head-to-Head
                  </button>
                </div>

                <button
                  onClick={exportCSV}
                  className="px-3.5 py-2 bg-[#084867] hover:bg-[#0D6B98] text-white rounded-xl text-xs font-semibold flex items-center border border-[#0D6B98] transition shadow-sm"
                >
                  <IconDownload />
                  CSV
                </button>

                <button
                  onClick={() => setIsModalOpen(true)}
                  className="px-3.5 py-2 bg-[#4AFFA0] hover:bg-[#03E26D] text-[#022333] rounded-xl text-xs font-bold flex items-center transition shadow-md"
                >
                  <IconPlus />
                  Add Snapshot
                </button>
              </div>
            </div>

            {/* Metric KPI Banner (Matches image 2 preview) */}
            <div className="max-w-7xl mx-auto grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mt-8">
              <div className="bg-[#084867] border border-[#0D6B98] rounded-xl p-4 relative overflow-hidden">
                <div className="flex justify-between items-start">
                  <span className="text-xs uppercase font-extrabold tracking-wider text-gray-300">VC Capital in Scope</span>
                  <IconDollar />
                </div>
                <div className="text-3xl font-black text-white mt-1">
                  ${stats.totalCapital} <span className="text-sm font-normal text-gray-300">Million</span>
                </div>
                <div className="text-xs text-gray-300 mt-1">Based on active filters</div>
              </div>

              <div className="bg-[#084867] border border-[#0D6B98] rounded-xl p-4 relative overflow-hidden">
                <div className="flex justify-between items-start">
                  <span className="text-xs uppercase font-extrabold tracking-wider text-gray-300">Total Rounds</span>
                  <IconBriefcase />
                </div>
                <div className="text-3xl font-black text-[#4AFFA0] mt-1">{stats.totalDeals}</div>
                <div className="text-xs text-gray-300 mt-1">PitchBook closed transactions</div>
              </div>

              <div className="bg-[#084867] border border-[#0D6B98] rounded-xl p-4 relative overflow-hidden">
                <div className="flex justify-between items-start">
                  <span className="text-xs uppercase font-extrabold tracking-wider text-gray-300">Average Round Size</span>
                  <IconTrendingUp />
                </div>
                <div className="text-3xl font-black text-white mt-1">
                  ${stats.avgRound} <span className="text-sm font-normal text-gray-300">M/deal</span>
                </div>
                <div className="text-xs text-gray-300 mt-1">Mean capital per round</div>
              </div>

              <div className="bg-[#084867] border border-[#0D6B98] rounded-xl p-4 relative overflow-hidden">
                <div className="flex justify-between items-start">
                  <span className="text-xs uppercase font-extrabold tracking-wider text-gray-300">Leading Hub</span>
                  <IconBuilding />
                </div>
                <div className="text-2xl font-black text-[#4AFFA0] mt-1 truncate">{stats.topMarket}</div>
                <div className="text-xs text-gray-300 mt-1">${stats.topMarketVal}M total VC logged</div>
              </div>
            </div>
          </header>

          {/* Body Content Area */}
          <main className="max-w-7xl mx-auto px-6 py-8 flex-1 w-full">
            
            {/* Search and Filters Bar (Clean White Card as in original preview) */}
            <div className="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row gap-4 items-center">
              {/* Keyword Search */}
              <div className="relative flex-1 w-full">
                <div className="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
                  <IconSearch />
                </div>
                <input
                  type="text"
                  value={searchTerm}
                  onChange={(e) => setSearchTerm(e.target.value)}
                  placeholder="Search by keyword, company, biotech, cyber, robotics..."
                  className="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#0D6B98] focus:bg-white transition"
                />
              </div>

              {/* Market Filter */}
              <select
                value={selectedMarket}
                onChange={(e) => setSelectedMarket(e.target.value)}
                className="w-full md:w-44 px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-[#0D6B98]"
              >
                <option value="ALL">All Markets</option>
                {availableMarkets.map(m => (
                  <option key={m} value={m}>{m}</option>
                ))}
              </select>

              {/* Year Filter */}
              <select
                value={selectedYear}
                onChange={(e) => setSelectedYear(e.target.value)}
                className="w-full md:w-32 px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-[#0D6B98]"
              >
                <option value="ALL">All Years</option>
                {availableYears.map(y => (
                  <option key={y} value={y}>{y}</option>
                ))}
              </select>

              {/* Quarter Filter */}
              <select
                value={selectedQuarter}
                onChange={(e) => setSelectedQuarter(e.target.value)}
                className="w-full md:w-28 px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-medium text-slate-700 focus:outline-none focus:ring-2 focus:ring-[#0D6B98]"
              >
                <option value="ALL">Qtr</option>
                <option value="Q1">Q1</option>
                <option value="Q2">Q2</option>
                <option value="Q3">Q3</option>
                <option value="Q4">Q4</option>
              </select>

              {/* Sort Order */}
              <select
                value={sortBy}
                onChange={(e) => setSortBy(e.target.value)}
                className="w-full md:w-48 px-3 py-2.5 bg-[#084867] text-white border border-[#0D6B98] rounded-xl text-sm font-semibold focus:outline-none"
              >
                <option value="vc-desc">Highest VC ($M) First</option>
                <option value="vc-asc">Lowest VC ($M) First</option>
                <option value="deals-desc">Most Deals</option>
                <option value="deals-asc">Fewest Deals</option>
                <option value="newest">Latest Published</option>
              </select>
            </div>

            {/* TAB VIEW 1: ARTICLE SNAPSHOTS GRID */}
            {viewMode === 'snapshots' && (
              <div>
                <div className="flex justify-between items-center mb-4">
                  <h2 className="text-xl font-bold text-[#022333]">
                    Venture Monitor Articles <span className="text-sm font-normal text-slate-500">({filteredArticles.length} matching snapshots)</span>
                  </h2>
                </div>

                {filteredArticles.length === 0 ? (
                  <div className="bg-white rounded-2xl p-12 text-center border border-slate-200 text-slate-500">
                    <p className="text-base font-semibold">No articles match your chosen filters.</p>
                    <p className="text-xs mt-1 text-slate-400">Try broadening your search term or market selection.</p>
                  </div>
                ) : (
                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    {filteredArticles.map(article => (
                      <div 
                        key={article.id}
                        className="bg-white rounded-2xl p-6 border border-slate-200 hover:border-[#0D6B98] hover:shadow-lg transition flex flex-col justify-between"
                      >
                        <div>
                          {/* Badges */}
                          <div className="flex items-center justify-between mb-3">
                            <span className="bg-[#022333] text-[#A7FFD1] text-xs font-extrabold px-3 py-1 rounded-md">
                              {article.market}
                            </span>
                            <span className="text-xs font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded">
                              {article.quarter} {article.year}
                            </span>
                          </div>

                          {/* Article Title */}
                          <h3 className="font-bold text-slate-900 text-base leading-snug hover:text-[#0D6B98] transition mb-3">
                            <a href={article.url} target="_blank" rel="noreferrer">
                              {article.title}
                              <IconExternal />
                            </a>
                          </h3>

                          {/* Summary */}
                          <p className="text-xs text-slate-600 line-clamp-3 leading-relaxed mb-4">
                            {article.summary}
                          </p>

                          {/* Key Deals Pills */}
                          {article.notableDeals && article.notableDeals.length > 0 && (
                            <div className="mb-4">
                              <span className="text-[11px] font-bold text-slate-400 block mb-1 uppercase tracking-wider">Top Rounds:</span>
                              <div className="flex flex-wrap gap-1.5">
                                {article.notableDeals.map((deal, idx) => (
                                  <span key={idx} className="text-[11px] bg-slate-100 text-slate-700 px-2 py-0.5 rounded font-medium border border-slate-200">
                                    {deal}
                                  </span>
                                ))}
                              </div>
                            </div>
                          )}
                        </div>

                        {/* Article Metrics Footer */}
                        <div className="border-t border-slate-100 pt-4 mt-2 grid grid-cols-3 gap-2 text-center bg-slate-50/80 -mx-6 -mb-6 p-4 rounded-b-2xl">
                          <div>
                            <div className="text-[10px] uppercase font-bold text-slate-400">Total VC</div>
                            <div className="text-base font-extrabold text-[#0D6B98]">
                              ${article.totalCapitalMillions}M
                            </div>
                          </div>
                          <div>
                            <div className="text-[10px] uppercase font-bold text-slate-400">Deals</div>
                            <div className="text-base font-extrabold text-[#022333]">
                              {article.dealCount}
                            </div>
                          </div>
                          <div>
                            <div className="text-[10px] uppercase font-bold text-slate-400">Avg Round</div>
                            <div className="text-base font-extrabold text-[#03E26D]">
                              ${article.avgDealSizeMillions}M
                            </div>
                          </div>
                        </div>

                      </div>
                    ))}
                  </div>
                )}
              </div>
            )}

            {/* TAB VIEW 2: HEAD-TO-HEAD MARKET COMPARISON (Highest to Lowest VC) */}
            {viewMode === 'compare' && (
              <div className="space-y-6">
                <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200">
                  <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                    <div>
                      <h2 className="text-2xl font-black text-[#022333]">Market Head-to-Head Comparison</h2>
                      <p className="text-xs text-slate-500 mt-1">
                        Ranked automatically from highest VC funding raised to lowest, showing deal counts and average check size
                      </p>
                    </div>

                    {/* Toggle Markets Included */}
                    <div className="flex flex-wrap items-center gap-2">
                      <span className="text-xs font-bold text-slate-400 uppercase mr-1">Select Hubs:</span>
                      {availableMarkets.map(m => {
                        const isSelected = compareSelectedMarkets.includes(m);
                        return (
                          <button
                            key={m}
                            onClick={() => {
                              setCompareSelectedMarkets(prev => 
                                isSelected ? prev.filter(x => x !== m) : [...prev, m]
                              );
                            }}
                            className={`px-3 py-1.5 rounded-full text-xs font-bold transition ${
                              isSelected
                                ? 'bg-[#03E26D] text-[#022333] shadow-sm'
                                : 'bg-slate-100 text-slate-500 hover:bg-slate-200'
                            }`}
                          >
                            {m} {isSelected ? '✓' : '+'}
                          </button>
                        );
                      })}
                    </div>
                  </div>

                  {/* Ranked Cards Grid */}
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                    {comparisonStats.map((item, index) => (
                      <div 
                        key={item.market}
                        className={`rounded-2xl p-6 border transition relative overflow-hidden ${
                          index === 0 
                            ? 'bg-gradient-to-br from-[#022333] to-[#084867] text-white border-[#4AFFA0] shadow-md' 
                            : 'bg-white text-slate-800 border-slate-200 shadow-sm'
                        }`}
                      >
                        <div className={`absolute top-4 right-4 text-3xl font-black opacity-30 ${index === 0 ? 'text-[#4AFFA0]' : 'text-slate-400'}`}>
                          #{index + 1}
                        </div>

                        <div className="mb-4">
                          <span className={`text-[10px] uppercase font-bold tracking-wider px-2 py-0.5 rounded ${
                            index === 0 ? 'bg-[#4AFFA0] text-[#022333]' : 'bg-slate-100 text-slate-600'
                          }`}>
                            {index === 0 ? '👑 Leader' : 'Ranked Hub'}
                          </span>
                          <h3 className="text-2xl font-black mt-2">{item.market}</h3>
                        </div>

                        <div className="space-y-4">
                          <div>
                            <div className={`text-xs uppercase font-bold ${index === 0 ? 'text-gray-300' : 'text-slate-400'}`}>
                              Total VC Volume
                            </div>
                            <div className={`text-3xl font-black ${index === 0 ? 'text-[#4AFFA0]' : 'text-[#0D6B98]'}`}>
                              ${item.totalCapitalMillions.toFixed(1)}M
                            </div>
                          </div>

                          <div className="grid grid-cols-2 gap-2 pt-3 border-t border-slate-200/40 text-xs">
                            <div>
                              <span className={index === 0 ? 'text-gray-300' : 'text-slate-500'}>Total Deals: </span>
                              <strong className={index === 0 ? 'text-white' : 'text-slate-900 font-bold'}>{item.dealCount}</strong>
                            </div>
                            <div>
                              <span className={index === 0 ? 'text-gray-300' : 'text-slate-500'}>Avg Round: </span>
                              <strong className={index === 0 ? 'text-white' : 'text-slate-900 font-bold'}>${item.avgCheckMillions.toFixed(1)}M</strong>
                            </div>
                          </div>

                          <div className={`text-[11px] ${index === 0 ? 'text-gray-300' : 'text-slate-400'}`}>
                            Aggregated from {item.reportCount} PitchBook snapshot article(s).
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>

                  {/* Summary Comparison Table */}
                  <div className="mt-8 overflow-x-auto">
                    <table className="w-full text-left border-collapse text-sm">
                      <thead>
                        <tr className="border-b border-slate-200 text-slate-400 text-xs uppercase font-extrabold tracking-wider">
                          <th className="py-3 px-4">Rank</th>
                          <th className="py-3 px-4">Market / Hub</th>
                          <th className="py-3 px-4 text-right">Total VC Raised ($M)</th>
                          <th className="py-3 px-4 text-right">Total Deal Count</th>
                          <th className="py-3 px-4 text-right">Avg Check Size ($M)</th>
                          <th className="py-3 px-4 text-center">Coverage Depth</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100">
                        {comparisonStats.map((item, idx) => (
                          <tr key={item.market} className="hover:bg-slate-50 transition">
                            <td className="py-3.5 px-4 font-black text-slate-500">#{idx + 1}</td>
                            <td className="py-3.5 px-4 font-bold text-slate-900">{item.market}</td>
                            <td className="py-3.5 px-4 font-black text-[#0D6B98] text-right">
                              ${item.totalCapitalMillions.toFixed(1)}M
                            </td>
                            <td className="py-3.5 px-4 text-right font-semibold text-slate-700">{item.dealCount}</td>
                            <td className="py-3.5 px-4 text-right font-semibold text-[#03E26D]">${item.avgCheckMillions.toFixed(2)}M</td>
                            <td className="py-3.5 px-4 text-center text-xs text-slate-500">{item.reportCount} reports</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>

                </div>
              </div>
            )}

          </main>

          {/* Add Snapshot Modal */}
          {isModalOpen && (
            <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200">
                <div className="flex justify-between items-center pb-4 border-b border-slate-100">
                  <h3 className="font-extrabold text-lg text-[#022333]">Add New Venture Snapshot</h3>
                  <button onClick={() => setIsModalOpen(false)} className="text-gray-400 hover:text-black font-bold text-lg">&times;</button>
                </div>

                <form onSubmit={handleFormSubmit} className="mt-4 space-y-4">
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Article Headline</label>
                    <input 
                      type="text" 
                      required 
                      value={formData.title} 
                      onChange={e => setFormData({...formData, title: e.target.value})}
                      placeholder="e.g. Philly venture funding hits $680M in Q4..."
                      className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                    />
                  </div>

                  <div className="grid grid-cols-3 gap-3">
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Market</label>
                      <select 
                        value={formData.market}
                        onChange={e => setFormData({...formData, market: e.target.value})}
                        className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                      >
                        <option value="Philadelphia">Philadelphia</option>
                        <option value="DC / DMV">DC / DMV</option>
                        <option value="Pittsburgh">Pittsburgh</option>
                        <option value="Baltimore">Baltimore</option>
                        <option value="Delaware">Delaware</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Quarter</label>
                      <select 
                        value={formData.quarter}
                        onChange={e => setFormData({...formData, quarter: e.target.value})}
                        className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                      >
                        <option value="Q1">Q1</option>
                        <option value="Q2">Q2</option>
                        <option value="Q3">Q3</option>
                        <option value="Q4">Q4</option>
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Year</label>
                      <input 
                        type="number"
                        required
                        value={formData.year}
                        onChange={e => setFormData({...formData, year: e.target.value})}
                        className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Total Capital ($M)</label>
                      <input 
                        type="number" 
                        step="0.1" 
                        required 
                        value={formData.totalCapitalMillions} 
                        onChange={e => setFormData({...formData, totalCapitalMillions: e.target.value})}
                        placeholder="680.5"
                        className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Deal Count</label>
                      <input 
                        type="number" 
                        required 
                        value={formData.dealCount} 
                        onChange={e => setFormData({...formData, dealCount: e.target.value})}
                        placeholder="78"
                        className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                      />
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Key Deals (comma separated)</label>
                    <input 
                      type="text" 
                      value={formData.notableDeals} 
                      onChange={e => setFormData({...formData, notableDeals: e.target.value})}
                      placeholder="BioNano ($75M), FedTech ($40M)"
                      className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Summary Excerpt</label>
                    <textarea 
                      rows="3" 
                      value={formData.summary} 
                      onChange={e => setFormData({...formData, summary: e.target.value})}
                      placeholder="Brief excerpt from the Technical.ly snapshot report..."
                      className="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm"
                    />
                  </div>

                  <div className="flex justify-end gap-2 pt-2">
                    <button 
                      type="button" 
                      onClick={() => setIsModalOpen(false)}
                      className="px-4 py-2 text-sm text-slate-500 hover:text-slate-800 font-semibold"
                    >
                      Cancel
                    </button>
                    <button 
                      type="submit" 
                      className="px-5 py-2 bg-[#03E26D] hover:bg-[#4AFFA0] text-[#022333] font-bold rounded-lg text-sm shadow"
                    >
                      Save Snapshot
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Footer */}
          <footer className="bg-white border-t border-slate-200 py-6 mt-12 text-center text-xs text-slate-400">
            Technical.ly Venture Monitor Snapshot Dashboard &bull; Designed strictly according to Technical.ly brand guidelines &bull; PitchBook-NVCA dataset series
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
