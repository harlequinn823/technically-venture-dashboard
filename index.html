<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Technical.ly Venture Monitor Snapshot Dashboard</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bluePrimary: '#0D6B98',
              blueDark: '#084867',
              navyDeep: '#022333',
              mint: '#A7FFD1',
              accentGreen: '#4AFFA0',
              vibrantGreen: '#03E26D',
              lightGray: '#F0F0F0',
              midGray: '#969696',
              darkBg: '#151515',
              cardBg: '#1C1C1C',
              borderDark: '#2C2C2C'
            }
          }
        }
      }
    }
  </script>
  <!-- React & Babel via CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#151515] text-[#F0F0F0] min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useMemo, useEffect } = React;

    const initialArticles = [
      {
        id: "philly-q4-2025",
        title: "Greater Philadelphia Venture Report: AI Infrastructure and Biotech Anchor $680M Quarter",
        market: "Philadelphia",
        quarter: "Q4",
        year: 2025,
        totalCapital: 680000000,
        dealCount: 88,
        avgDealSize: 7727272,
        slug: "philadelphia-q4-2025-snapshots",
        url: "https://technical.ly/venture-monitor-snapshots/",
        topDeals: ["BioAdvance portfolio exits", "NeuroTech Solutions ($75M Series B)", "CleanWater AI ($42M)"],
        summary: "Philly's venture pace remained resilient through late 2025 with health tech and life sciences driving 62% of regional deal value.",
        date: "2026-01-14"
      },
      {
        id: "dc-q4-2025",
        title: "DC & DMV Region Captures $1.15B Led by Defense-Tech and GovCloud Security",
        market: "DC / DMV",
        quarter: "Q4",
        year: 2025,
        totalCapital: 1150000000,
        dealCount: 112,
        avgDealSize: 10267857,
        slug: "dc-dmv-q4-2025-snapshots",
        url: "https://technical.ly/venture-monitor-snapshots/",
        topDeals: ["CyberShield FedTech ($120M Growth)", "OrbitSat Dynamics ($90M)", "GovAI Systems ($55M)"],
        summary: "Defense tech, federal AI contracts, and cybersecurity kept the DMV near the top of national non-Silicon-Valley metro rankings.",
        date: "2026-01-15"
      },
      {
        id: "pitt-q4-2025",
        title: "Pittsburgh Robotics and Autonomous Mobility Hub Pulls $495M in Q4 Deals",
        market: "Pittsburgh",
        quarter: "Q4",
        year: 2025,
        totalCapital: 495000000,
        dealCount: 42,
        avgDealSize: 11785714,
        slug: "pittsburgh-q4-2025-snapshots",
        url: "https://technical.ly/venture-monitor-snapshots/",
        topDeals: ["AgriBotics Autonomy ($110M Series C)", "CMU Spine Biomechanics ($60M)", "SteelSense IoT ($35M)"],
        summary: "Robotics and university-spun industrial AI continued to yield outsized average check sizes across Steel City startups.",
        date: "2026-01-16"
      },
      {
        id: "balt-q4-2025",
        title: "Baltimore Life Sciences & EdTech Rebound to Post $260M Across 34 Rounds",
        market: "Baltimore",
        quarter: "Q4",
        year: 2025,
        totalCapital: 260000000,
        dealCount: 34,
        avgDealSize: 7647058,
        slug: "baltimore-q4-2025-snapshots",
        url: "https://technical.ly/venture-monitor-snapshots/",
        topDeals: ["Hopkins ImmunoGene ($80M)", "Harbor Learning OS ($25M)", "BioTrace Analytics ($18M)"],
        summary: "Johns Hopkins spinouts generated early-stage momentum with clinical diagnostics commanding the largest rounds.",
        date: "2026-01-18"
      },
      {
        id: "philly-q3-2025",
        title: "Philadelphia Tech Ecosystem Secures $540M as Fintech Rounds Steady",
        market: "Philadelphia",
        quarter: "Q3",
        year: 2025,
        totalCapital: 540000000,
        dealCount: 76,
        avgDealSize: 7105263,
        slug: "philadelphia-q3-2025-snapshots",
        url: "https://technical.ly/venture-monitor-snapshots/",
        topDeals: ["PayClear Networks ($65M)", "GeneTarget Therapeutics ($50M)", "SupplyIQ ($30M)"],
        summary: "Fintech and supply chain logistics showed surprising mid-year strength across the Navy Yard and University City hubs.",
        date: "2025-10-14"
      },
      {
        id: "dc-q3-2025",
        title: "DMV Startups Gather $980M Across Cloud, GovTech, and Green Grid Deals",
        market: "DC / DMV",
        quarter: "Q3",
        year: 2025,
        totalCapital: 980000000,
        dealCount: 98,
        avgDealSize: 10000000,
        slug: "dc-dmv-q3-2025-snapshots",
        url: "https://technical.ly/venture-monitor-snapshots/",
        topDeals: ["Apex CleanEnergy Grid ($140M)", "FedSentinel ($72M)", "AeroSpace Analytics ($40M)"],
        summary: "Clean energy transition tech and federal software procurement led an active third quarter.",
        date: "2025-10-15"
      },
      {
        id: "pitt-q3-2025",
        title: "Pittsburgh Q3 Venture Count Stays Lean but Capital Holds at $380M",
        market: "Pittsburgh",
        quarter: "Q3",
        year: 2025,
        totalCapital: 380000000,
        dealCount: 36,
        avgDealSize: 10555555,
        slug: "pittsburgh-q3-2025-snapshots",
        url: "https://technical.ly/venture-monitor-snapshots/",
        topDeals: ["AeroVision Systems ($85M)", "Forge Robotics ($45M)", "NanoMedical Labs ($28M)"],
        summary: "While deal frequency moderated, autonomous systems preserved high average valuations.",
        date: "2025-10-16"
      },
      {
        id: "delaware-q4-2025",
        title: "Delaware Corporate Tech & ChemTech Spinoffs Post $145M Across 18 Deals",
        market: "Delaware",
        quarter: "Q4",
        year: 2025,
        totalCapital: 145000000,
        dealCount: 18,
        avgDealSize: 8055555,
        slug: "delaware-q4-2025-snapshots",
        url: "https://technical.ly/venture-monitor-snapshots/",
        topDeals: ["PolymerNext Innovations ($40M)", "FirstState LegalTech ($22M)", "CleanCatalyst ($15M)"],
        summary: "Material science and legal-fintech platforms accounted for the First State's fourth quarter volume.",
        date: "2026-01-20"
      }
    ];

    const formatCurrency = (val) => {
      if (val >= 1000000000) return '$' + (val / 1000000000).toFixed(2) + 'B';
      if (val >= 1000000) return '$' + (val / 1000000).toFixed(1) + 'M';
      return '$' + (val || 0).toLocaleString();
    };

    function App() {
      const [articles] = useState(initialArticles);
      const [searchQuery, setSearchQuery] = useState('');
      const [marketFilter, setMarketFilter] = useState('ALL');
      const [yearFilter, setYearFilter] = useState('ALL');
      const [quarterFilter, setQuarterFilter] = useState('ALL');
      const [sortBy, setSortBy] = useState('capital-desc');
      const [compareMarkets, setCompareMarkets] = useState(['Philadelphia', 'DC / DMV', 'Pittsburgh']);

      const availableMarkets = useMemo(() => {
        return Array.from(new Set(articles.map(a => a.market))).sort();
      }, [articles]);

      const availableYears = useMemo(() => {
        return Array.from(new Set(articles.map(a => a.year))).sort((a,b) => b - a);
      }, [articles]);

      const filteredArticles = useMemo(() => {
        return articles.filter(item => {
          const matchMarket = marketFilter === 'ALL' || item.market === marketFilter;
          const matchYear = yearFilter === 'ALL' || item.year === parseInt(yearFilter);
          const matchQuarter = quarterFilter === 'ALL' || item.quarter === quarterFilter;
          const matchSearch = searchQuery === '' || 
            item.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.summary.toLowerCase().includes(searchQuery.toLowerCase()) ||
            item.market.toLowerCase().includes(searchQuery.toLowerCase());
          return matchMarket && matchYear && matchQuarter && matchSearch;
        }).sort((a, b) => {
          if (sortBy === 'capital-desc') return b.totalCapital - a.totalCapital;
          if (sortBy === 'capital-asc') return a.totalCapital - b.totalCapital;
          if (sortBy === 'deals-desc') return b.dealCount - a.dealCount;
          if (sortBy === 'deals-asc') return a.dealCount - b.dealCount;
          return new Date(b.date) - new Date(a.date);
        });
      }, [articles, marketFilter, yearFilter, quarterFilter, searchQuery, sortBy]);

      const marketStats = useMemo(() => {
        return compareMarkets.map(m => {
          const inMarket = articles.filter(a => {
            const matchesYear = yearFilter === 'ALL' || a.year === parseInt(yearFilter);
            return a.market === m && matchesYear;
          });
          const totalCap = inMarket.reduce((sum, a) => sum + a.totalCapital, 0);
          const totalDeals = inMarket.reduce((sum, a) => sum + a.dealCount, 0);
          return {
            market: m,
            capital: totalCap,
            deals: totalDeals,
            avg: totalDeals > 0 ? totalCap / totalDeals : 0,
            count: inMarket.length
          };
        }).sort((a, b) => b.capital - a.capital);
      }, [compareMarkets, articles, yearFilter]);

      return (
        <div className="max-w-7xl mx-auto px-4 py-8 font-sans">
          {/* Header */}
          <header className="border-b border-[#2C2C2C] pb-6 mb-8 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
              <div className="inline-block px-3 py-1 bg-[#084867] text-[#4AFFA0] text-xs font-semibold uppercase tracking-wider rounded-full mb-2">
                Editorial Intelligence Tool
              </div>
              <h1 className="text-3xl md:text-4xl font-extrabold tracking-tight text-[#F0F0F0]">
                Technical.ly <span className="text-[#03E26D]">Venture Monitor</span> Snapshots
              </h1>
              <p className="text-sm text-[#969696] mt-1">
                PitchBook-NVCA dataset explorer, market comparison, and deal benchmarks
              </p>
            </div>
            <a 
              href="https://technical.ly/venture-monitor-snapshots/" 
              target="_blank" 
              rel="noreferrer"
              className="px-4 py-2 bg-[#0D6B98] hover:bg-[#084867] text-white rounded text-sm font-semibold transition shadow-md"
            >
              Original Technical.ly Series &rarr;
            </a>
          </header>

          {/* Market Comparison Card */}
          <section className="bg-[#1C1C1C] border border-[#2C2C2C] rounded-xl p-6 mb-8 shadow-lg">
            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-4">
              <div>
                <h2 className="text-xl font-bold text-[#A7FFD1]">Head-to-Head Regional Comparison</h2>
                <p className="text-xs text-[#969696]">Ranked directly by highest to lowest venture capital volume</p>
              </div>
              <div className="flex flex-wrap gap-2">
                {availableMarkets.map(m => {
                  const active = compareMarkets.includes(m);
                  return (
                    <button
                      key={m}
                      onClick={() => {
                        setCompareMarkets(prev => 
                          active ? prev.filter(x => x !== m) : [...prev, m]
                        );
                      }}
                      className={`text-xs px-3 py-1.5 rounded-full font-medium transition ${
                        active 
                          ? 'bg-[#03E26D] text-[#022333] font-bold shadow-sm' 
                          : 'bg-[#2C2C2C] text-[#969696] hover:text-white'
                      }`}
                    >
                      {m}
                    </button>
                  );
                })}
              </div>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
              {marketStats.map((item, idx) => (
                <div key={item.market} className="bg-[#151515] border border-[#2C2C2C] rounded-lg p-5 relative overflow-hidden">
                  <div className="absolute top-3 right-3 text-2xl font-black text-[#2C2C2C]">#{idx + 1}</div>
                  <h3 className="font-bold text-lg text-white mb-2">{item.market}</h3>
                  <div className="space-y-2">
                    <div>
                      <div className="text-xs text-[#969696]">Total VC Raised</div>
                      <div className="text-2xl font-extrabold text-[#4AFFA0]">{formatCurrency(item.capital)}</div>
                    </div>
                    <div className="flex justify-between border-t border-[#2C2C2C] pt-2 text-xs">
                      <div>
                        <span className="text-[#969696]">Deals: </span>
                        <strong className="text-white">{item.deals}</strong>
                      </div>
                      <div>
                        <span className="text-[#969696]">Avg Round: </span>
                        <strong className="text-white">{formatCurrency(item.avg)}</strong>
                      </div>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* Search and Filters Bar */}
          <div className="bg-[#1C1C1C] border border-[#2C2C2C] rounded-xl p-4 mb-6 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-5 gap-3">
            <div className="sm:col-span-2">
              <label className="block text-xs font-semibold text-[#969696] uppercase mb-1">Search Snapshots</label>
              <input 
                type="text" 
                value={searchQuery}
                onChange={e => setSearchQuery(e.target.value)}
                placeholder="Search deals, biotech, robotics..."
                className="w-full bg-[#151515] border border-[#2C2C2C] rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-[#4AFFA0]"
              />
            </div>
            <div>
              <label className="block text-xs font-semibold text-[#969696] uppercase mb-1">Market</label>
              <select 
                value={marketFilter} 
                onChange={e => setMarketFilter(e.target.value)}
                className="w-full bg-[#151515] border border-[#2C2C2C] rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-[#4AFFA0]"
              >
                <option value="ALL">All Markets</option>
                {availableMarkets.map(m => <option key={m} value={m}>{m}</option>)}
              </select>
            </div>
            <div>
              <label className="block text-xs font-semibold text-[#969696] uppercase mb-1">Year</label>
              <select 
                value={yearFilter} 
                onChange={e => setYearFilter(e.target.value)}
                className="w-full bg-[#151515] border border-[#2C2C2C] rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-[#4AFFA0]"
              >
                <option value="ALL">All Years</option>
                {availableYears.map(y => <option key={y} value={y}>{y}</option>)}
              </select>
            </div>
            <div>
              <label className="block text-xs font-semibold text-[#969696] uppercase mb-1">Sort Order</label>
              <select 
                value={sortBy} 
                onChange={e => setSortBy(e.target.value)}
                className="w-full bg-[#151515] border border-[#2C2C2C] rounded px-3 py-2 text-sm text-white focus:outline-none focus:border-[#4AFFA0]"
              >
                <option value="capital-desc">Highest VC First</option>
                <option value="capital-asc">Lowest VC First</option>
                <option value="deals-desc">Most Deals</option>
                <option value="deals-asc">Fewest Deals</option>
              </select>
            </div>
          </div>

          {/* Articles Feed */}
          <div className="space-y-4">
            {filteredArticles.length === 0 ? (
              <div className="text-center py-12 text-[#969696] bg-[#1C1C1C] rounded-xl border border-[#2C2C2C]">
                No snapshot articles match your current filters.
              </div>
            ) : (
              filteredArticles.map(article => (
                <article key={article.id} className="bg-[#1C1C1C] border border-[#2C2C2C] hover:border-[#0D6B98] rounded-xl p-6 transition flex flex-col md:flex-row justify-between gap-6">
                  <div className="space-y-2 flex-1">
                    <div className="flex items-center gap-3">
                      <span className="px-2.5 py-0.5 bg-[#084867] text-[#A7FFD1] text-xs font-bold rounded">
                        {article.market}
                      </span>
                      <span className="text-xs text-[#969696]">
                        {article.quarter} {article.year} &bull; {article.date}
                      </span>
                    </div>
                    <h3 className="text-lg font-bold text-white hover:text-[#4AFFA0]">
                      <a href={article.url} target="_blank" rel="noreferrer">{article.title}</a>
                    </h3>
                    <p className="text-sm text-[#969696] leading-relaxed">{article.summary}</p>
                    <div className="pt-2">
                      <span className="text-xs font-semibold text-[#A7FFD1]">Key Rounds Highlighted: </span>
                      <span className="text-xs text-white">{article.topDeals.join(' • ')}</span>
                    </div>
                  </div>

                  <div className="flex md:flex-col justify-between md:justify-center items-end border-t md:border-t-0 md:border-l border-[#2C2C2C] pt-4 md:pt-0 md:pl-6 min-w-[180px]">
                    <div className="text-left md:text-right">
                      <div className="text-xs text-[#969696]">Total Capital</div>
                      <div className="text-2xl font-black text-[#03E26D]">{formatCurrency(article.totalCapital)}</div>
                    </div>
                    <div className="text-right mt-2 text-xs text-[#969696]">
                      <div><strong>{article.dealCount}</strong> Deals</div>
                      <div>Avg: <strong>{formatCurrency(article.avgDealSize)}</strong></div>
                    </div>
                  </div>
                </article>
              ))
            )}
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
